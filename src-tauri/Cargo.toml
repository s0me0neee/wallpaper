[package]
name = "wallpaper"
version = "1.0.2"
description = "Floating wallpaper picker and CLI setter"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wallpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["macos-private-api"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-log = "2.8.0"
log = "0.4.29"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
image = { version = "0.25.10", default-features = false, features = [
	"jpeg",
	"png",
	"webp",
	"gif",
	"bmp",
] }
base64 = "0.22.1"
thiserror = "2.0.18"
toml = "1.1.2"
wp = { package = "wallpaper", version = "3.2.0" }
duct = "1.1.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-cli = "2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.1"
objc = "0.2.7"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = [
	"cargo_bench_support",
] }

[[bench]]
name = "thumbnail_bench"
harness = false

[profile.dev]
opt-level = 2 # compile faster than release but run much faster than debug

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
